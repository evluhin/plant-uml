AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PlantUML Renderer Service

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  JWTSecretParameter:
    Type: String
    Default: /plantuml/renderer/jwt-secret
    Description: SSM Parameter path for JWT secret

Globals:
  Function:
    Timeout: 20
    MemorySize: 256
    Runtime: java11
    Architectures:
      - x86_64
    Environment:
      Variables:
        NODE_ENV: !Ref Environment
        JWT_SECRET_PARAM: !Ref JWTSecretParameter
        LOG_PAYLOADS: false

Resources:
  # PlantUML Layer with JAR and Graphviz
  PlantUMLLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub plantuml-layer-${Environment}
      Description: PlantUML JAR and Graphviz binaries
      ContentUri: layers/plantuml-layer/
      CompatibleRuntimes:
        - java11
      CompatibleArchitectures:
        - x86_64
    Metadata:
      BuildMethod: makefile

  # JWT Authorizer Function
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub plantuml-authorizer-${Environment}
      CodeUri: authorizer/
      Handler: index.handler
      Runtime: nodejs18.x
      Timeout: 10
      MemorySize: 128
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${JWTSecretParameter}'

  # Lambda Function
  RendererFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub plantuml-renderer-${Environment}
      CodeUri: .
      Handler: com.plantuml.Handler::handleRequest
      SnapStart:
        ApplyOn: PublishedVersions
      Layers:
        - !Ref PlantUMLLayer
      Environment:
        Variables:
          GRAPHVIZ_DOT: /opt/bin/dot
          PLANTUML_JAR: /opt/plantuml.jar
      AutoPublishAlias: live
      Events:
        RenderApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref RendererApi
            Path: /render
            Method: post
            Auth:
              Authorizer: JWTAuthorizer
        HealthApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref RendererApi
            Path: /health
            Method: get
      VersionDescription: !Sub "Version deployed at ${AWS::StackName}"


  # HTTP API Gateway
  RendererApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      Auth:
        Authorizers:
          JWTAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            FunctionInvokeRole: !GetAtt AuthorizerInvokeRole.Arn
            Identity:
              Headers:
                - Authorization
            AuthorizerPayloadFormatVersion: "1.0"
            EnableSimpleResponses: false
            AuthorizerResultTtlInSeconds: 3600
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - POST
          - GET
          - OPTIONS
        MaxAge: 600

  # IAM Role for API Gateway to invoke Authorizer
  AuthorizerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeAuthorizerFunction
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AuthorizerFunction.Arn

  # CloudWatch Log Group
  RendererLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/plantuml-renderer-${Environment}
      RetentionInDays: 14

Outputs:
  RendererApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${RendererApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub plantuml-renderer-url-${Environment}
  
  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt RendererFunction.Arn
    Export:
      Name: !Sub plantuml-renderer-arn-${Environment}
  
  FunctionAliasArn:
    Description: Lambda Function Alias ARN (for SnapStart)
    Value: !Ref RendererFunction.Alias
    Export:
      Name: !Sub plantuml-renderer-alias-arn-${Environment}