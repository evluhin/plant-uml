name: Deploy to Staging

on:
  push:
    branches: [main, develop]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  SAM_CLI_TELEMETRY: 0
  AWS_DEFAULT_REGION: eu-north-1

jobs:
  deploy-renderer:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    outputs:
      renderer-url: ${{ steps.deploy.outputs.renderer-url }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python for SAM
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
      
      - name: Deploy renderer to staging
        id: deploy
        run: |
          cd services/renderer
          sam deploy \
            --config-env stg \
            --parameter-overrides "Environment=stg JWTSecretParameter=${{ secrets.RENDERER_JWT_SECRET_PARAM }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
          
          RENDERER_URL=$(aws cloudformation describe-stacks \
            --stack-name plantuml-renderer-stg \
            --query 'Stacks[0].Outputs[?OutputKey==`RendererApiUrl`].OutputValue' \
            --output text)
          echo "renderer-url=${RENDERER_URL}" >> $GITHUB_OUTPUT

  deploy-forge:
    runs-on: ubuntu-latest
    needs: deploy-renderer
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install Forge CLI
        run: npm install -g @forge/cli
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
      
      - name: Deploy Forge app to staging
        env:
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
        run: |
          cd apps/forge-plantuml
          forge deploy --environment ${{ secrets.FORGE_ENV_STG }} --non-interactive
          forge install --product confluence --environment ${{ secrets.FORGE_ENV_STG }} --non-interactive

  test-staging:
    runs-on: ubuntu-latest
    needs: [deploy-renderer, deploy-forge]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install jsonwebtoken
      
      - name: Run staging tests
        env:
          RENDERER_URL: ${{ needs.deploy-renderer.outputs.renderer-url }}
          RENDERER_JWT_SECRET: ${{ secrets.RENDERER_JWT_SECRET }}
          CI_ENVIRONMENT_NAME: staging
        run: node scripts/self-test.js