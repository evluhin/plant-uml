name: Deploy Production

on:
  workflow_dispatch: # Manual trigger only for now
  # Uncomment below when ready for production auto-deployment
  # push:
  #   branches: [master]
  #   paths:
  #     - 'services/renderer/**'
  #     - 'apps/forge-plantuml/**'
  #     - 'package*.json'

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '11'

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install dependencies
        run: npm ci

      - name: Deploy Lambda to prod
        run: |
          cd services/renderer
          sam build --cached

          # Deploy and capture output
          if ! sam deploy --config-env prod --no-confirm-changeset --region ${{ vars.AWS_REGION }} --stack-name plantuml-renderer-prod --resolve-s3 --capabilities CAPABILITY_IAM 2>&1 | tee deploy_output.log; then
            # Check if failure was due to no changes
            if grep -q "No changes to deploy" deploy_output.log; then
              echo "✅ No changes to deploy - stack is up to date"
              exit 0
            else
              echo "❌ Deployment failed"
              cat deploy_output.log
              exit 1
            fi
          else
            echo "✅ Deployment successful"
          fi

      - name: Install Forge CLI
        run: npm install -g @forge/cli@latest

      - name: Deploy Forge app to production
        env:
          CI: true
          FORGE_DISABLE_ANALYTICS: true
          FORGE_EMAIL: ${{ vars.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        run: |
          cd apps/forge-plantuml
          npm ci --ignore-scripts
          forge deploy --environment production --non-interactive --no-verify

      - name: Production smoke test
        run: |
          # Wait for deployment
          sleep 30
          # Run smoke tests
          ./scripts/smoke-test.sh ${{ vars.RENDERER_URL_PROD }}

      - name: Create release
        if: success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            Automated release from main branch
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
