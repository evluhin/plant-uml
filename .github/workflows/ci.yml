name: CI

on:
  push:
    branches: [master, develop]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'package*.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master, develop]

env:
  NODE_VERSION: '20'
  SAM_CLI_TELEMETRY: 0
  CI: true

jobs:
  # Fast lint and test in parallel
  quality-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ${{ matrix.check }}
        run: npm run ${{ matrix.check }}

      - name: Upload coverage reports
        if: matrix.check == 'test'
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false

  # E2E tests only on PRs or when Forge app changes
  test-e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[e2e]')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright
        run: cd apps/forge-plantuml && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd apps/forge-plantuml && npm run test:ui

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/forge-plantuml/playwright-report/
          retention-days: 3

  # Build validation - only if quality checks pass
  build-validation:
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '11'

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build Forge app
        run: |
          cd apps/forge-plantuml
          npm run build

      - name: Build SAM application
        run: |
          cd services/renderer
          sam build --cached
