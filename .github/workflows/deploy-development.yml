name: Deploy Development

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches: [develop]
  workflow_dispatch: # Manual trigger

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '11'
  SAM_CLI_TELEMETRY: 0

jobs:
  # Check if CI passed and determine what to deploy
  check-and-prepare:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    outputs:
      aws-changed: ${{ steps.changes.outputs.aws }}
      forge-changed: ${{ steps.changes.outputs.forge }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        run: |
          # For manual triggers, deploy everything
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - deploying all components"
            echo "aws=true" >> $GITHUB_OUTPUT
            echo "forge=true" >> $GITHUB_OUTPUT
          else
            # For workflow_run triggers, check what changed
            if git diff --name-only HEAD~1 HEAD | grep -E '^services/renderer/'; then
              echo "aws=true" >> $GITHUB_OUTPUT
            else
              echo "aws=false" >> $GITHUB_OUTPUT
            fi

            if git diff --name-only HEAD~1 HEAD | grep -E '^apps/forge-plantuml/'; then
              echo "forge=true" >> $GITHUB_OUTPUT
            else
              echo "forge=false" >> $GITHUB_OUTPUT
            fi
          fi

  # Deploy AWS Lambda only if renderer changed
  deploy-aws:
    runs-on: ubuntu-latest
    needs: check-and-prepare
    if: needs.check-and-prepare.outputs.aws-changed == 'true'
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy Lambda to dev
        run: |
          cd services/renderer
          sam build --cached
          sam deploy --config-env dev --no-confirm-changeset --region ${{ vars.AWS_REGION }} --stack-name plantuml-renderer-dev --resolve-s3 --capabilities CAPABILITY_IAM

  # Deploy Forge only if app changed
  deploy-forge:
    runs-on: ubuntu-latest
    needs: check-and-prepare
    if: needs.check-and-prepare.outputs.forge-changed == 'true'
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Forge CLI
        run: npm install -g @forge/cli@latest

      - name: Deploy Forge app to development
        env:
          CI: true
          FORGE_DISABLE_ANALYTICS: true
          FORGE_EMAIL: ${{ vars.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        run: |
          cd apps/forge-plantuml
          npm ci --ignore-scripts
          forge deploy --environment development --non-interactive

  # Smoke test only after successful deployments
  smoke-test:
    runs-on: ubuntu-latest
    needs: [check-and-prepare, deploy-aws, deploy-forge]
    if: always() && (needs.deploy-aws.result == 'success' || needs.deploy-forge.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Wait for deployment
        run: sleep 30

      - name: Run smoke tests
        run: ./scripts/smoke-test.sh ${{ vars.RENDERER_URL_DEV }}
