name: CI and Deploy Development

on:
  push:
    branches: [develop]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'package*.json'
      - '.github/workflows/**'
  workflow_dispatch: # Manual trigger

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'
  SAM_CLI_TELEMETRY: 0

jobs:
  # Run CI checks and determine what to deploy
  ci-and-check:
    runs-on: ubuntu-latest
    outputs:
      aws-changed: ${{ steps.changes.outputs.aws }}
      forge-changed: ${{ steps.changes.outputs.forge }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build validation
        run: |
          # Build Forge app
          cd apps/forge-plantuml
          npm run build
          cd ../..

      - name: Detect changes
        id: changes
        run: |
          # For manual triggers, deploy everything
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - deploying all components"
            echo "aws=true" >> $GITHUB_OUTPUT
            echo "forge=true" >> $GITHUB_OUTPUT
          else
            # For push triggers, check what changed
            if git diff --name-only HEAD~1 HEAD | grep -E '^services/renderer/'; then
              echo "aws=true" >> $GITHUB_OUTPUT
            else
              echo "aws=false" >> $GITHUB_OUTPUT
            fi

            if git diff --name-only HEAD~1 HEAD | grep -E '^apps/forge-plantuml/'; then
              echo "forge=true" >> $GITHUB_OUTPUT
            else
              echo "forge=false" >> $GITHUB_OUTPUT
            fi
          fi

  # Deploy AWS Lambda only if renderer changed and CI passed
  deploy-aws:
    runs-on: ubuntu-latest
    needs: ci-and-check
    if: needs.ci-and-check.outputs.aws-changed == 'true'
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy Lambda to dev
        run: |
          cd services/renderer
          sam build --cached

          # Deploy and capture output
          if ! sam deploy --config-env dev --no-confirm-changeset --region ${{ vars.AWS_REGION }} --stack-name plantuml-renderer-dev --resolve-s3 --capabilities CAPABILITY_IAM 2>&1 | tee deploy_output.log; then
            # Check if failure was due to no changes
            if grep -q "No changes to deploy" deploy_output.log; then
              echo "✅ No changes to deploy - stack is up to date"
              exit 0
            else
              echo "❌ Deployment failed"
              cat deploy_output.log
              exit 1
            fi
          else
            echo "✅ Deployment successful"
          fi

  # Deploy Forge only if app changed and CI passed
  deploy-forge:
    runs-on: ubuntu-latest
    needs: ci-and-check
    if: needs.ci-and-check.outputs.forge-changed == 'true'
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Forge CLI
        run: npm install -g @forge/cli@latest

      - name: Deploy Forge app to development
        env:
          CI: true
          FORGE_DISABLE_ANALYTICS: true
          FORGE_EMAIL: ${{ vars.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        run: |
          cd apps/forge-plantuml
          npm ci --ignore-scripts
          forge deploy --environment development --non-interactive --no-verify

  # Smoke test only after successful deployments
  smoke-test:
    runs-on: ubuntu-latest
    needs: [ci-and-check, deploy-aws, deploy-forge]
    if: always() && (needs.deploy-aws.result == 'success' || needs.deploy-forge.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Wait for deployment
        run: sleep 30

      - name: Run smoke tests
        run: ./scripts/smoke-test.sh ${{ vars.RENDERER_URL_DEV }}
