modules:
  macro:
    - key: plantuml-macro
      title: PlantUML
      description: Create and edit PlantUML diagrams
      function: plantuml-ui
      render: native

  function:
    - key: plantuml-ui
      handler: ui-kit2/index.run
    - key: plantuml-resolver
      handler: resolver/index.render

permissions:
  scopes:
    - read:confluence-content.summary
    - write:confluence-content
    - storage:app
  external:
    fetch:
      backend:
        - address: "https://pb3hubgska.execute-api.eu-north-1.amazonaws.com/dev"

app:
  id: ari:cloud:ecosystem::app/5cdc958f-0844-4ecf-967b-5ba58b1f2cff
  runtime:
    name: nodejs22.x