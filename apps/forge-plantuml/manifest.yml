modules:
  macro:
    - key: plantuml-macro
      title: PlantUML
      description: Create and edit PlantUML diagrams
      render: native
      resource: main
      resolver:
        function: renderDiagram
      config:
        openOnInsert: true
        resource: config
        render: native

  function:
    - key: renderDiagram
      handler: index.renderDiagram
    - key: refreshDiagram
      handler: index.refreshDiagram

resources:
  - key: main
    path: src/frontend/index.jsx
  - key: config
    path: src/macro-config.jsx



permissions:
  scopes:
    - read:confluence-content.summary
    - write:confluence-content
    - storage:app
  external:
    fetch:
      backend:
        - "https://pb3hubgska.execute-api.eu-north-1.amazonaws.com/dev"

app:
  id: ari:cloud:ecosystem::app/5cdc958f-0844-4ecf-967b-5ba58b1f2cff
  runtime:
    name: nodejs22.x